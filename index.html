<!DOCTYPE html>
<html lang="zh-HK" data-theme="cream">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bingo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+HK:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/bingo.css">
  <script>
    try {
      var saved = JSON.parse(localStorage.getItem('bingo-caller-prefs') || '{}');
      var themes = { cream: 1, ice: 1, matcha: 1, night: 1 };
      if (themes[saved.theme]) document.documentElement.dataset.theme = saved.theme;
      if (saved.language === 'en') document.documentElement.lang = 'en';
    } catch (e) {}
  </script>
</head>
<body>
  <section id="setup" class="setup">
    <div class="mini-row" aria-hidden="true">
      <div class="ball mini" data-col="B"><span class="band">B</span><span class="num">7</span></div>
      <div class="ball mini" data-col="I"><span class="band">I</span><span class="num">22</span></div>
      <div class="ball mini" data-col="N"><span class="band">N</span><span class="num">38</span></div>
      <div class="ball mini" data-col="G"><span class="band">G</span><span class="num">54</span></div>
      <div class="ball mini" data-col="O"><span class="band">O</span><span class="num">68</span></div>
    </div>
    <h1>Bingo</h1>
    <div id="setup-langs" class="lang-list" role="list"></div>
    <div class="slider-row">
      <span class="clock" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
      </span>
      <span class="slider-wrap">
        <input id="setup-interval" type="range" min="1" max="30" step="1" value="8">
        <span class="slider-ends" aria-hidden="true"><span>1</span><span>30</span></span>
      </span>
      <span class="slider-val" data-interval-val aria-hidden="true">8</span>
    </div>
    <div id="setup-themes" class="theme-row" role="group"></div>
    <p id="setup-wake" class="wake-hint" hidden></p>
    <button id="setup-play" class="play setup-play" type="button">
      <svg width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5.2v13.6c0 .7.8 1.1 1.4.7l10-6.8a.8.8 0 0 0 0-1.4l-10-6.8A.8.8 0 0 0 8 5.2z"/></svg>
    </button>
  </section>

  <section id="table" class="table" hidden>
    <header class="topbar">
      <p class="brand">Bingo</p>
      <div class="top-actions">
        <button id="lang-chip" class="lang-chip" type="button">
          <span class="lang-name"></span>
          <svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.2 4.2L6 8l3.8-3.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="settings-open" class="gear" type="button">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>
    <div class="table-body">
      <div class="stage">
        <div class="hero-row">
          <div id="hero" class="ball hero-ball placeholder" aria-live="polite" aria-atomic="true">
            <span class="band"></span>
            <span class="num"></span>
            <span id="hero-status" class="vh" hidden></span>
          </div>
          <button id="prev-ball" class="ball prev" type="button" hidden>
            <span class="band"></span>
            <span class="num"></span>
          </button>
        </div>
        <div class="transport">
          <p id="progress" class="progress">0／75</p>
          <button id="transport" class="play" type="button" data-mode="play">
            <svg class="icon-play" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5.2v13.6c0 .7.8 1.1 1.4.7l10-6.8a.8.8 0 0 0 0-1.4l-10-6.8A.8.8 0 0 0 8 5.2z"/></svg>
            <svg class="icon-pause" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true" hidden><path fill="currentColor" d="M6 4.5h4.2v15H6zM13.8 4.5H18v15h-4.2z"/></svg>
            <svg class="icon-new" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true" hidden><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M20 12a8 8 0 1 1-2.2-5.5"/><path fill="currentColor" d="M19.2 3.2v5.2h-5.2z"/></svg>
            <span class="transport-label"></span>
          </button>
          <button id="replay" class="icon-btn" type="button" disabled>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h3l5 4V6L7 10H4z"/><path d="M16 9.5a4 4 0 0 1 0 5"/><path d="M18.5 7a7 7 0 0 1 0 10"/></svg>
          </button>
        </div>
        <div class="slider-row play-slider">
          <span class="clock" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
          </span>
          <span class="slider-wrap">
            <input id="table-interval" type="range" min="1" max="30" step="1" value="8">
            <span class="slider-ends" aria-hidden="true"><span>1</span><span>30</span></span>
          </span>
          <span class="slider-val" data-interval-val aria-hidden="true">8</span>
        </div>
        <p id="table-wake" class="wake-hint" hidden></p>
      </div>
      <div class="board-wrap">
        <div id="board" class="board"></div>
      </div>
    </div>
  </section>

  <dialog id="lang-dialog">
    <div id="sheet-langs" class="lang-list" role="list"></div>
  </dialog>

  <dialog id="settings-dialog">
    <div class="settings-bar">
      <h2 id="settings-title"></h2>
      <button id="settings-close" class="icon-btn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="settings-langs" class="lang-list" role="list"></div>
    <div id="settings-themes" class="theme-row" role="group"></div>
    <button id="settings-new" class="text-action" type="button"></button>
  </dialog>

  <dialog id="confirm-dialog" aria-labelledby="confirm-text">
    <p id="confirm-text">已叫的數會清零</p>
    <div class="confirm-actions">
      <button id="confirm-cancel" type="button"></button>
      <button id="confirm-ok" type="button"></button>
    </div>
  </dialog>

  <script src="js/domain.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
